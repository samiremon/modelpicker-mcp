name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.11 --extra dev
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check modelpicker tests scripts server.py test_setup.py
      - run: uv run --no-sync ruff format --check modelpicker tests scripts server.py test_setup.py
