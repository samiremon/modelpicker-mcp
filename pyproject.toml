[project]
name = "modelpicker-mcp"
version = "0.1.0"
description = "Find prompt-injection guard models and measure how well they protect MCP agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "huggingface-hub>=0.23",
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
guards = [
    "torch>=2.2",
    "transformers>=4.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
