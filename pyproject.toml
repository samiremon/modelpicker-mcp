[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modelpicker-mcp"
version = "0.2.0"
description = "Chat-driven, reproducible model evaluation on your own computer"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp>=1.30,<2", "huggingface-hub>=0.36,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "psutil>=6,<8", "uvicorn>=0.35,<1", "filelock>=3.16,<4"]

[project.optional-dependencies]
local = ["torch>=2.6,<3", "transformers>=4.57,<5", "datasets>=4,<5"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
modelpicker = "modelpicker.cli:main"

[tool.setuptools.packages.find]
include = ["modelpicker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform != 'darwin'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
